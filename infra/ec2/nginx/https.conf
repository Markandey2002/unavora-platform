# UNAVORA edge: TLS termination and reverse proxy to the Next.js server (website, staff CRM and the /_bff routes).
# The Spring Boot API is NOT published: Next.js calls it on the private Docker network (API_INTERNAL_URL). /internal/**
# and the actuator are therefore unreachable from the internet (ARCHITECTURE §4, D-017). When the mobile app needs
# /api/v1/**, add a location for it here, never for /internal/**.
server_tokens off;

# Docker's embedded DNS: re-resolve "web" so a recreated container (new IP) is found without restarting nginx.
resolver 127.0.0.11 valid=10s ipv6=off;

# Unknown host names (scanners hitting the IP address) get no answer and no certificate.
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    ssl_reject_handshake on;
    return 444;
}

server {
    listen 80;
    server_name __DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:UNAVORA_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Owner submissions and staff uploads: 5 photos x 5 MB in one Server Action (Next allows 27 MB, the API too).
    client_max_body_size 28m;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Approved public media, written by the API to the shared volume (interim local-disk adapter until S3 + CDN).
    # Only approved files are ever copied here; private originals and owner documents live in a different folder.
    location /media/ {
        root /srv;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location / {
        set $web_upstream http://web:3000;
        proxy_pass $web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        # nginx is the first hop: overwrite (never append) so a client cannot forge the address used for rate limits.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
    }
}
