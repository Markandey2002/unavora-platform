# Used only until the first Let's Encrypt certificate for __DOMAIN__ exists (see 40-unavora-tls.sh).
# Nothing but ACME challenges is served over plain HTTP: staff and customer sessions need HTTPS (Secure cookies).
server_tokens off;

server {
    listen 80 default_server;
    return 444;
}

server {
    listen 80;
    server_name __DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        default_type text/plain;
        return 503 "TLS certificate pending for __DOMAIN__\n";
    }
}
