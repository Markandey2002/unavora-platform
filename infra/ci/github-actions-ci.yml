name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: maven }
      - run: mvn -B -q verify
        working-directory: services/api        # Testcontainers uses the runner's Docker
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci || npm install
        working-directory: apps/web
      - run: npm run lint && npm test && npm run build
        working-directory: apps/web
# No deploy job exists on purpose. Staging/production deployment requires separate approval (ARCHITECTURE §14).
