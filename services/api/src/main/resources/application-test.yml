# Automated tests. Datasource is injected by Testcontainers (@ServiceConnection); no external services.
spring:
  flyway:
    locations: classpath:db/migration,classpath:db/seed-local
  security.oauth2.resourceserver.jwt.issuer-uri:
unavora:
  files:
    scanner: mock
  media:
    serve-local: true
  public:
    include-sample-content: true                                # LOCAL/TEST ONLY: show [SAMPLE] records (SyntheticDataGuard)
  cors-allowed-origins: http://localhost:3000
  internal.service-token: test-internal-token
  customer-auth.google.mode: mock
  staff-auth.mode: mock          # simulated IdP; MFA presence controlled per test
  otp:
    whatsapp.mode: mock
    secret: test-otp-hmac-secret-0123456789
