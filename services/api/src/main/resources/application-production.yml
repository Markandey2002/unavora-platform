# PRODUCTION (requires separate explicit human approval before use). No defaults for any secret or URL:
# the application must fail to start if one is missing.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  security.oauth2.resourceserver.jwt.issuer-uri: ${OIDC_ISSUER_URI}
unavora:
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS}
  internal.service-token: ${INTERNAL_SERVICE_TOKEN}
  customer-auth.google:
    mode: ${CUSTOMER_GOOGLE_MODE}
    client-id: ${GOOGLE_OAUTH_CLIENT_ID}
  otp:
    whatsapp.mode: ${WHATSAPP_OTP_MODE}
    secret: ${OTP_HMAC_SECRET}
