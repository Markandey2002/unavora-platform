# Shared defaults. Every environment overrides via its own profile file; secrets come ONLY from environment
# variables / secret stores, never from this repository.
spring:
  application.name: unavora-api
  jpa.open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:8}
      connection-timeout: 3000
  security.oauth2.resourceserver.jwt.issuer-uri: ${OIDC_ISSUER_URI:}
server:
  port: 8080
  forward-headers-strategy: framework
  error.include-message: never
  error.include-stacktrace: never
management:
  server.port: 8081            # internal only; never routed by a load balancer
  endpoints.web.exposure.include: health,info
  endpoint.health.probes.enabled: true
unavora:
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  rate-limit:
    enquiry-per-ip-per-hour: 10
    staff-signin-per-ip-per-10min: 60   # an office behind one NAT shares an IP
  features:
    whatsapp-automation: false   # stays false unless an approved test provider is configured
    live-payments: false
  # Service credential the Next.js BFF presents on /internal/v1/** (Secrets Manager outside local).
  internal.service-token: ${INTERNAL_SERVICE_TOKEN:}
  # Customer "Continue with Google": disabled | mock (local/test only) | google (needs an approved OAuth client id)
  customer-auth.google:
    mode: ${CUSTOMER_GOOGLE_MODE:disabled}
    client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
  customer-session:
    idle: P7D
    absolute: P30D
  # Staff/director website sign-in (BFF -> API -> OIDC provider, Authorization Code + PKCE). Invitation-only.
  staff-auth:
    mode: ${STAFF_AUTH_MODE:oidc}                       # oidc | mock (automated tests only)
    issuer-uri: ${STAFF_OIDC_ISSUER_URI:${spring.security.oauth2.resourceserver.jwt.issuer-uri:}}   # same issuer as bearer tokens unless overridden
    client-id: ${STAFF_OIDC_CLIENT_ID:web-bff}
    client-secret: ${STAFF_OIDC_CLIENT_SECRET:}
    redirect-uri: ${STAFF_OIDC_REDIRECT_URI:}
    post-logout-redirect-uri: ${STAFF_OIDC_POST_LOGOUT_REDIRECT_URI:}   # sign-out also ends the IdP session
  staff-session:
    idle: PT30M            # sliding
    absolute: PT12H        # hard limit
    mfa-absolute: PT8H     # roles with requires_mfa (director)
  # WhatsApp number verification: disabled | mock (local/test only). No real provider adapter exists yet.
  otp:
    whatsapp.mode: ${WHATSAPP_OTP_MODE:disabled}
    secret: ${OTP_HMAC_SECRET:}
