openapi: 3.1.0
info:
  title: UNAVORA API
  version: 0.5.0
  description: >-
    Implemented endpoints only. Behaviour is covered by MockMvc integration tests (services/api/src/test) and the local
    validation scripts; there are no automated OpenAPI contract tests yet. /internal/v1/** is called only by the
    Next.js BFF with the service credential and is never routed publicly. Every /api/v1/staff/** and
    /api/v1/director/** path is also served under /internal/v1/** for the BFF (staff session header).
servers:
  - url: http://localhost:8080
paths:
  /api/v1/public/properties:
    get:
      security: []
      summary: Search published, available properties
      parameters:
        - { name: lang, in: query, schema: { type: string, enum: [en, hi], default: en } }
        - { name: city, in: query, schema: { type: string } }
        - { name: type, in: query, description: property type code (e.g. apartment, villa, plot), schema: { type: string } }
        - { name: category, in: query, description: groups of types; unknown value -> 400, schema: { type: string, enum: [residential, commercial, land] } }
        - { name: minPrice, in: query, schema: { type: number } }
        - { name: maxPrice, in: query, schema: { type: number } }
        - { name: bedrooms, in: query, schema: { type: integer } }
        - { name: q, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200": { description: Page of properties, content: { application/json: { schema: { $ref: "#/components/schemas/PropertyPage" } } } }
        "400": { $ref: "#/components/responses/Problem" }
  /api/v1/public/locations:
    get:
      security: []
      summary: Cities and localities that currently have public listings, with counts (same visibility rules as search)
      parameters:
        - { name: lang, in: query, schema: { type: string, enum: [en, hi], default: en } }
      responses:
        "200": { description: Locations, content: { application/json: { schema: { $ref: "#/components/schemas/LocationList" } } } }
        "400": { $ref: "#/components/responses/Problem" }
  /api/v1/public/properties/{slug}:
    get:
      security: []
      summary: Property detail
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: lang, in: query, schema: { type: string, enum: [en, hi], default: en } }
      responses:
        "200": { description: Detail, content: { application/json: { schema: { $ref: "#/components/schemas/PropertyDetail" } } } }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/public/enquiries:
    post:
      security: []
      summary: Submit an enquiry (creates or reuses customer, creates lead)
      parameters:
        - { name: Idempotency-Key, in: header, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/EnquiryRequest" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/EnquiryResponse" } } } }
        "200": { description: Replay of an earlier idempotent request, content: { application/json: { schema: { $ref: "#/components/schemas/EnquiryResponse" } } } }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /api/v1/public/channel-partners:
    post:
      security: []
      summary: Channel-partner application (channel_partners row with status applied + CRM lead, enquiry type channel_partner)
      parameters:
        - { name: Idempotency-Key, in: header, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PartnerRequest" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/EnquiryResponse" } } } }
        "200": { description: Replay of an earlier idempotent request, content: { application/json: { schema: { $ref: "#/components/schemas/EnquiryResponse" } } } }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /api/v1/public/projects:
    get:
      security: []
      summary: Published projects (new launches); RERA number only when verified
      parameters:
        - { name: lang, in: query, schema: { type: string, enum: [en, hi], default: en } }
      responses:
        "200": { description: Projects, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/ProjectSummary" } } } } } } }
        "400": { $ref: "#/components/responses/Problem" }
  /api/v1/public/projects/{slug}:
    get:
      security: []
      summary: Published project detail with unit types
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: lang, in: query, schema: { type: string, enum: [en, hi], default: en } }
      responses:
        "200": { description: Detail, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectDetail" } } } }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/public/company:
    get:
      security: []
      summary: Company facts confirmed by the business (verified = true only); unverified values are never returned
      responses:
        "200":
          description: Company
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings: { type: object, additionalProperties: { type: string }, description: "display_name, tagline, legal_name, phone, whatsapp, email, cin, rera_number when verified" }
                  social: { type: object, additionalProperties: { type: string, format: uri } }
                  offices: { type: array, items: { type: object, properties: { kind: { type: string }, city: { type: string }, locality: { type: [string, "null"] }, address: { type: [string, "null"] }, pinCode: { type: [string, "null"] }, phone: { type: [string, "null"] } } } }
  /api/v1/staff/leads:
    get:
      summary: Leads visible to the caller (own, or all with lead.read_all)
      security: [{ bearer: [] }]
      parameters:
        - { name: stage, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200": { description: OK }
        "401": { description: Unauthenticated }
        "403": { description: No lead permission }
  /api/v1/staff/leads/{id}:
    get:
      summary: Lead detail; 404 if not visible to the caller
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { "200": { description: OK }, "404": { $ref: "#/components/responses/Problem" } }
  /api/v1/director/overview:
    get:
      summary: Company-wide summary (permission report.director)
      security: [{ bearer: [] }]
      responses: { "200": { description: OK }, "403": { description: Forbidden } }
  /api/v1/staff/customers:
    get:
      summary: Customers visible to the caller (customer.read_all = all; customer.read_own = assigned or own-lead customers)
      security: [{ bearer: [] }]
      parameters:
        - { name: registered, in: query, schema: { type: boolean }, description: "true = website-registered only (incl. no enquiry yet)" }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses: { "200": { description: OK }, "401": { description: No token }, "403": { description: Forbidden } }
  /api/v1/staff/customers/{id}:
    get:
      summary: Customer detail with contact actions (tel, wa.me), latest consents, visible leads, communications, follow-ups
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { "200": { description: OK }, "404": { description: Not found or not visible to caller } }
  /api/v1/staff/customers/{id}/communications:
    post:
      summary: Record a call or WhatsApp contact (employee_recorded, recorded_manual; never delivered) (lead.update)
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel, direction, summary]
              properties:
                channel: { type: string, enum: [phone, whatsapp] }
                direction: { type: string, enum: [inbound, outbound] }
                summary: { type: string, maxLength: 500 }
                leadId: { type: string, format: uuid }
      responses: { "201": { description: Created }, "404": { description: Not visible }, "422": { $ref: "#/components/responses/Problem" } }
  /api/v1/staff/customers/{id}/follow-ups:
    post:
      summary: Create a follow-up task assigned to the caller (task.manage_own)
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, dueAt]
              properties:
                title: { type: string, maxLength: 200 }
                description: { type: string, maxLength: 2000 }
                dueAt: { type: string, format: date-time }
                leadId: { type: string, format: uuid }
      responses: { "201": { description: Created }, "404": { description: Not visible }, "422": { $ref: "#/components/responses/Problem" } }
  /internal/v1/customer-auth/google:
    post:
      summary: BFF only. Verify Google credential (mode mock or google), create-or-load ONE customer, start session
      security: [{ service: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [credential], properties: { credential: { type: string }, language: { type: string, enum: [en, hi] } } } } }
      responses: { "200": { description: "sessionToken, expiresAt, newAccount, customer" }, "401": { $ref: "#/components/responses/Problem" }, "429": { $ref: "#/components/responses/Problem" } }
  /internal/v1/customer-auth/logout:
    post:
      summary: BFF only. Revoke the customer session
      security: [{ service: [] }]
      parameters: [{ $ref: "#/components/parameters/CustomerSession" }]
      responses: { "204": { description: Revoked } }
  /internal/v1/customer/me:
    get:
      summary: BFF only. Signed-in customer profile
      security: [{ service: [] }]
      parameters: [{ $ref: "#/components/parameters/CustomerSession" }]
      responses: { "200": { description: OK }, "401": { description: Session missing or expired } }
  /internal/v1/customer/whatsapp/otp:
    post:
      summary: BFF only. Send a 6-digit WhatsApp code (10 min TTL, 30 s resend, 5 per hour). Adapter mock or disabled.
      security: [{ service: [] }]
      parameters: [{ $ref: "#/components/parameters/CustomerSession" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [phone], properties: { phone: { type: string }, language: { type: string } } } } } }
      responses: { "202": { description: Sent }, "200": { description: Already verified }, "429": { $ref: "#/components/responses/Problem" }, "503": { $ref: "#/components/responses/Problem" } }
  /internal/v1/customer/whatsapp/verify:
    post:
      summary: BFF only. Verify the code (max 5 wrong attempts)
      security: [{ service: [] }]
      parameters: [{ $ref: "#/components/parameters/CustomerSession" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [phone, code], properties: { phone: { type: string }, code: { type: string, pattern: "^[0-9]{6}$" } } } } } }
      responses: { "200": { description: Verified profile }, "422": { $ref: "#/components/responses/Problem" }, "429": { $ref: "#/components/responses/Problem" } }
  /internal/v1/customer/requests:
    post:
      summary: BFF only. Verified customer enquiry, callback or site visit; a NEW lead each time
      security: [{ service: [] }]
      parameters:
        - { $ref: "#/components/parameters/CustomerSession" }
        - { name: Idempotency-Key, in: header, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, enquiryConsent, marketingConsent]
              properties:
                type: { type: string, enum: [enquiry, callback, site_visit] }
                propertyId: { type: string, format: uuid }
                message: { type: string, maxLength: 2000 }
                preferredDate: { type: string, format: date }
                preferredTime: { type: string, format: time }
                enquiryConsent: { type: boolean, const: true }
                marketingConsent: { type: boolean }
      responses: { "201": { description: Created }, "200": { description: Idempotent replay }, "409": { description: WhatsApp not verified }, "422": { $ref: "#/components/responses/Problem" } }
  /internal/v1/dev/mock-whatsapp/latest:
    get:
      summary: LOCAL/TEST ONLY (exists only when WhatsApp OTP mode is mock). Latest mock message for a number
      security: [{ service: [] }]
      parameters: [{ name: phone, in: query, required: true, schema: { type: string } }]
      responses: { "200": { description: OK }, "404": { description: None } }
  /internal/v1/staff-auth/start:
    post:
      summary: BFF only. Start staff sign-in (Authorization Code + PKCE); state, nonce and verifier stay in the API
      security: [{ service: [] }]
      responses: { "200": { description: "authorizationUrl, state" }, "429": { $ref: "#/components/responses/Problem" } }
  /internal/v1/staff-auth/complete:
    post:
      summary: BFF only. Complete sign-in; invitation-only; roles with requires_mfa need amr=otp; returns opaque session token
      security: [{ service: [] }]
      responses: { "200": { description: "sessionToken, expiresAt, idleTimeoutSeconds, language" }, "400": { description: login_expired }, "403": { description: "not_invited | mfa_required" } }
  /internal/v1/staff-auth/logout:
    post:
      summary: BFF only. Revoke the staff session; returns the IdP end-session URL (RP-initiated logout) or null
      security: [{ service: [] }]
      parameters:
        - { $ref: "#/components/parameters/StaffSession" }
        - { name: lang, in: query, schema: { type: string, enum: [en, hi] } }
      responses: { "200": { description: endSessionUrl } }
  /internal/v1/staff/me:
    get:
      summary: Signed-in staff member, roles, permissions, MFA state
      security: [{ service: [] }]
      parameters: [{ $ref: "#/components/parameters/StaffSession" }]
      responses: { "200": { description: OK }, "401": { description: "Session missing, expired, revoked or lacking required MFA" } }
  /api/v1/staff/dashboard:
    get:
      summary: "Caller's own dashboard: leads by stage, today's and upcoming visits, follow-up counts, recent leads (also /internal/v1/staff/dashboard)"
      security: [{ bearer: [] }]
      responses: { "200": { description: OK } }
  /api/v1/staff/pipeline:
    get:
      summary: Configured stages, allowed transitions and lost reasons
      security: [{ bearer: [] }]
      responses: { "200": { description: OK } }
  /api/v1/staff/assignees:
    get:
      summary: Active employees/directors for assignment (lead.assign, visit.manage_all or task.manage_all)
      security: [{ bearer: [] }]
      responses: { "200": { description: OK }, "403": { description: Forbidden } }
  /api/v1/staff/leads/{id}/stage:
    post:
      summary: Change stage (lead.update; own leads unless lead.read_all). Lost needs reasonCode (+note when required); Invalid needs note; reopening needs lead.reopen; Won needs a completed deal
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [toStage]
              properties:
                toStage: { type: string }
                expectedVersion: { type: integer, description: optimistic locking; 409 stale_lead if different }
                reasonCode: { type: string }
                note: { type: string, maxLength: 1000 }
      responses: { "200": { description: "leadId, fromStage, toStage, version" }, "404": { description: Not visible }, "409": { $ref: "#/components/responses/Problem" }, "422": { $ref: "#/components/responses/Problem" } }
  /api/v1/staff/leads/{id}/assign:
    post:
      summary: Assign or reassign (lead.assign). Reassignment needs a reason; open follow-ups and upcoming visits move with the lead
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assigneeId]
              properties: { assigneeId: { type: string, format: uuid }, expectedVersion: { type: integer }, reason: { type: string, maxLength: 1000 } }
      responses: { "200": { description: "previousUserId, newUserId, method, movedFollowUps, movedVisits" }, "403": { description: Forbidden }, "409": { $ref: "#/components/responses/Problem" }, "422": { $ref: "#/components/responses/Problem" } }
  /api/v1/staff/leads/{id}/history:
    get:
      summary: Stage history (from, to, by, reason, time) and assignment history (previous, new, by, method, reason, time)
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { "200": { description: OK }, "404": { description: Not visible } }
  /api/v1/staff/leads/{id}/activities:
    get:
      summary: Lead timeline
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { "200": { description: OK }, "404": { description: Not visible } }
  /api/v1/staff/site-visits:
    get:
      summary: Visits visible to the caller (visit.read_all = all; else assigned to me or on my leads)
      security: [{ bearer: [] }]
      parameters:
        - { name: scope, in: query, schema: { type: string, enum: [today, upcoming, past, all], default: upcoming } }
        - { name: leadId, in: query, schema: { type: string, format: uuid } }
      responses: { "200": { description: OK } }
    post:
      summary: Schedule a visit (visit.manage_own for self, visit.manage_all for anyone). Time from 24 h ago to 180 days ahead; no two visits within 60 min per employee; lead open; property available
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [leadId, scheduledAt]
              properties:
                leadId: { type: string, format: uuid }
                propertyId: { type: string, format: uuid }
                scheduledAt: { type: string, format: date-time }
                assignedUserId: { type: string, format: uuid }
                locationNote: { type: string, maxLength: 300 }
      responses: { "201": { description: "id, reference, status, scheduledAt, version, leadStage" }, "409": { $ref: "#/components/responses/Problem" }, "422": { $ref: "#/components/responses/Problem" } }
  /api/v1/staff/site-visits/{id}:
    get:
      summary: Visit detail incl. customer feedback, internal notes (staff only) and status history
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { "200": { description: OK }, "404": { description: Not visible } }
  /api/v1/staff/site-visits/{id}/{action}:
    post:
      summary: "reschedule (scheduledAt + reason) | cancel (reason) | complete (feedback/interestAfter/employeeNotes/nextAction; only after the scheduled time) | no-show (only after the scheduled time). Never automatic."
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: action, in: path, required: true, schema: { type: string, enum: [reschedule, cancel, complete, no-show] } }
      responses: { "200": { description: OK }, "404": { description: Not visible }, "409": { $ref: "#/components/responses/Problem" }, "422": { $ref: "#/components/responses/Problem" } }
  /api/v1/staff/follow-ups:
    get:
      summary: My open follow-ups (priority, lead, visit), overdue first
      security: [{ bearer: [] }]
      responses: { "200": { description: OK } }
    post:
      summary: Create a follow-up on a lead and/or visit (due now..+1 year, priority low|normal|high, assignee others only with task.manage_all); duplicates refused
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, dueAt]
              properties:
                leadId: { type: string, format: uuid }
                siteVisitId: { type: string, format: uuid }
                title: { type: string, maxLength: 200 }
                description: { type: string, maxLength: 2000 }
                dueAt: { type: string, format: date-time }
                priority: { type: string, enum: [low, normal, high] }
                assignedTo: { type: string, format: uuid }
      responses: { "201": { description: Created }, "409": { description: duplicate_follow_up }, "422": { $ref: "#/components/responses/Problem" } }
  /api/v1/staff/follow-ups/{id}/complete:
    post:
      summary: Mark done (assignee or task.manage_all); already done -> 409
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { "200": { description: OK }, "404": { description: Not yours }, "409": { description: already_completed } }
components:
  parameters:
    StaffSession: { name: X-Staff-Session, in: header, required: true, schema: { type: string } }
    CustomerSession: { name: X-Customer-Session, in: header, required: true, schema: { type: string } }
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
    service: { type: apiKey, in: header, name: X-Internal-Service-Token, description: BFF service credential (never sent by browsers) }
  responses:
    Problem:
      description: RFC 7807 problem
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
  schemas:
    Problem:
      type: object
      properties: { status: { type: integer }, detail: { type: string }, code: { type: string }, fields: { type: object, additionalProperties: { type: string } } }
    EnquiryRequest:
      type: object
      required: [name, phone, consent]
      properties:
        name: { type: string, maxLength: 200 }
        phone: { type: string, maxLength: 20, description: Indian mobile or E.164 }
        email: { type: string, format: email }
        message: { type: string, maxLength: 2000 }
        propertyId: { type: string, format: uuid }
        language: { type: string, enum: [en, hi] }
        consent: { type: boolean, const: true }
        marketingConsent: { type: boolean, description: "Optional and separate from consent. Omitted = not asked; false = declined." }
        enquiryType: { type: string, enum: [general, callback, site_visit, residential, commercial, project], description: "Optional; ignored when propertyId is set (always a property enquiry). Unknown value -> 422" }
    PartnerRequest:
      type: object
      required: [name, phone, city, consent]
      properties:
        name: { type: string, maxLength: 200 }
        phone: { type: string, maxLength: 20 }
        email: { type: string, format: email }
        companyName: { type: string, maxLength: 200 }
        city: { type: string, maxLength: 100 }
        areasOfInterest: { type: string, maxLength: 500 }
        reraNumber: { type: string, maxLength: 60, description: declared by the applicant; stored as declared, not verified }
        message: { type: string, maxLength: 2000 }
        language: { type: string, enum: [en, hi] }
        consent: { type: boolean, const: true }
    ProjectSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        number: { type: integer }
        name: { type: string }
        slug: { type: string }
        city: { type: [string, "null"] }
        locality: { type: [string, "null"] }
        constructionStatus: { type: [string, "null"] }
        possessionDate: { type: [string, "null"], format: date }
        startingPrice: { type: [number, "null"] }
        unitTypes: { type: integer }
        reraNumber: { type: [string, "null"], description: only when verified by the business }
        language: { type: string }
    ProjectDetail:
      type: object
      properties:
        summary: { $ref: "#/components/schemas/ProjectSummary" }
        description: { type: [string, "null"] }
        units: { type: array, items: { type: object, properties: { label: { type: string }, bedrooms: { type: [integer, "null"] }, areaValue: { type: [number, "null"] }, areaUnit: { type: [string, "null"] }, basePrice: { type: [number, "null"] } } } }
    EnquiryResponse:
      type: object
      properties: { reference: { type: string }, status: { type: string } }
    PropertySummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        number: { type: integer }
        title: { type: string }
        slug: { type: string }
        city: { type: string }
        locality: { type: string }
