# UNAVORA ANANT INFRA - continuous integration (build + test only).
# Every job's commands were executed locally on 2026-11-07 on Windows (see docs/TEST_RESULTS.md). A Linux rehearsal
# could not complete on the dev PC (memory); the first GitHub run is the first Linux run.
# No deploy job exists on purpose. Staging/production deployment requires separate approval (ARCHITECTURE §14).
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs only; every commit on main keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      # safe.directory avoids git's "dubious ownership" error (container runs as root on a runner-owned checkout)
      - run: >
          docker run --rm
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo
          -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 git /repo --no-banner --redact -v

  api:
    name: API (unit + Testcontainers integration)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 21, cache: maven }
      - name: mvn verify (ArchUnit, DatabaseConstraintsIT, PublicPropertyIT, EnquiryAndLeadFlowIT, SecurityIT, CustomerIdentityIT, StaffSessionIT, LeadWorkflowIT)
        run: mvn -B verify
        working-directory: services/api        # Testcontainers uses the runner's Docker
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: api-test-reports
          path: services/api/target/*-reports/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: api-jar
          path: |
            services/api/target/unavora-api-*.jar
            !services/api/target/*-plain.jar
          if-no-files-found: error
          retention-days: 3

  web:
    name: Web (audit, typecheck, unit, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
        working-directory: apps/web
      # Audit runs first so an advisory fails fast instead of after the build.
      # If new advisories start blocking unrelated PRs, move this to a scheduled workflow.
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
        working-directory: apps/web
      - run: npm run lint && npm test && npm run build
        working-directory: apps/web

  e2e:
    name: End-to-end (Playwright + business flow) on the local stack
    needs: [api, web]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # MOCK adapters only: no Google account or WhatsApp provider is contacted. The token is the throw-away local
      # value from application-local.yml (not a secret); real values are never used in CI.
      CUSTOMER_AUTH_MODE: mock
      INTERNAL_SERVICE_TOKEN: local-dev-internal-token-not-a-secret
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 21 }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@v8
        with: { name: api-jar, path: api-jar }

      - name: Start PostgreSQL and Keycloak (local dev realm, synthetic users)
        # --wait blocks on healthchecks when the compose services define them (recommended); otherwise it waits for "running".
        run: docker compose up -d --wait postgres keycloak
      - name: Wait for PostgreSQL
        run: |
          for _ in $(seq 1 60); do
            docker compose exec -T postgres pg_isready > /dev/null 2>&1 && exit 0
            sleep 2
          done
          docker compose logs postgres | tail -n 100; exit 1
      - name: Wait for Keycloak
        run: |
          for _ in $(seq 1 90); do
            curl -sf http://localhost:8180/realms/unavora-dev/.well-known/openid-configuration > /dev/null && exit 0
            sleep 2
          done
          docker compose logs keycloak | tail -n 100; exit 1

      - name: Start API (local profile, synthetic seed)
        run: |
          jars=(api-jar/unavora-api-*.jar)
          [ "${#jars[@]}" -eq 1 ] || { echo "Expected exactly one API jar, found: ${jars[*]}"; exit 1; }
          nohup java -Xmx512m -jar "${jars[0]}" --spring.profiles.active=local > api.log 2>&1 &
          for _ in $(seq 1 90); do curl -sf http://localhost:8081/actuator/health > /dev/null && exit 0; sleep 2; done
          cat api.log; exit 1

      - name: Build and start web
        working-directory: apps/web
        run: |
          npm ci && npm run build
          nohup npm run start > ../../web.log 2>&1 &
          for _ in $(seq 1 60); do curl -sf http://localhost:3000/en > /dev/null && exit 0; sleep 2; done
          cat ../../web.log; exit 1

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/web/package-lock.json') }}
      - name: Playwright
        working-directory: apps/web
        run: npx playwright install --with-deps chromium && npm run e2e

      - name: Install Python script dependencies (if any)
        run: |
          if [ -f infra/local/scripts/requirements.txt ]; then
            python3 -m pip install -r infra/local/scripts/requirements.txt
          fi
      - name: Business flow scripts (enquiry -> CRM -> employee -> director with TOTP; customer signup mock slice)
        run: python3 infra/local/scripts/validate_business_flow.py && python3 infra/local/scripts/validate_customer_signup.py

      - name: Collect container logs
        if: failure()
        run: |
          docker compose logs --no-color > compose.log 2>&1 || true
          tail -n 200 api.log web.log || true
      - name: Upload e2e diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-diagnostics
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
            api.log
            web.log
            compose.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop stack
        if: always()
        run: docker compose down -v || true